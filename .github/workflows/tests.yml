name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Neither runner has a timeout of its own (see tests/test_harness.py),
    # so a wedged fifo test would otherwise hold the job for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Permission tests mean nothing as root, which reads anything; an
      # outside Linux run blamed carryon for failures that were its sandbox's.
      - name: Not root
        run: test "$(id -u)" -ne 0

      # run_tests.py exists for a bare machine: the system python3, no pytest,
      # so its pytest stub is what runs. Prove the stub is what ran.
      - name: run_tests.py (system python, no pytest)
        run: |
          if /usr/bin/python3 -c "import pytest" 2>/dev/null; then
            echo "system python3 has pytest; run_tests.py would not use its stub"
            exit 1
          fi
          set -o pipefail
          /usr/bin/python3 run_tests.py | tee run_tests.log

      - uses: actions/setup-python@v5
        if: ${{ !cancelled() }}
        with:
          python-version: "3.13"

      - name: pytest
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/ -q --junitxml=pytest.xml

      - name: Both runners ran the same tests
        if: ${{ !cancelled() }}
        run: python .github/compare_runners.py pytest.xml run_tests.log

      # pytest's own report can be cut short when a test misbehaves with the
      # terminal; the files are the record of what each runner saw.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reports-${{ matrix.os }}
          path: |
            pytest.xml
            run_tests.log

  # An Archive sealed under one openssl has to open under the other: macOS
  # ships LibreSSL as `openssl`, Linux ships OpenSSL 3, and the suite above
  # only ever opens what the same machine sealed. See .github/interop.py.
  seal:
    strategy:
      matrix:
        include:
          - { os: macos-latest, openssl: LibreSSL }
          - { os: ubuntu-latest, openssl: OpenSSL 3 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # /usr/bin first: the macOS image also carries Homebrew's OpenSSL 3,
      # and a user's Mac has only LibreSSL. interop.py checks which it got.
      - run: PATH=/usr/bin:$PATH python3 .github/interop.py seal sealed "${{ matrix.openssl }}"
      # a tarball keeps the Archive's modes; the artifact zip would not
      - run: tar -cf sealed.tar sealed
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-${{ matrix.os }}
          path: sealed.tar

  open:
    needs: seal
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, openssl: OpenSSL 3, from: macos-latest }
          - { os: macos-latest, openssl: LibreSSL, from: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sealed-${{ matrix.from }}
      - run: tar -xf sealed.tar
      - run: PATH=/usr/bin:$PATH python3 .github/interop.py open sealed "${{ matrix.openssl }}"
